apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: chess
spec:
  replicas: 1
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: web
          image: familyagent:dev
          imagePullPolicy: IfNotPresent
          command: ["python","-m","familyagent"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: {name: chess-config}
            - secretRef: {name: llm-credentials}
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: chess
spec:
  selector: {app: web}
  ports:
    - port: 8000
      targetPort: 8000
