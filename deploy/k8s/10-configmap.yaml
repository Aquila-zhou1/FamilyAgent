apiVersion: v1
kind: ConfigMap
metadata:
  name: chess-config
  namespace: chess
data:
  FASTAPI_HOST: "0.0.0.0"
  FASTAPI_PORT: "8000"
  FASTAPI_RELOAD: "false"
  MCP_HOST: "0.0.0.0"
  MCP_OPENINGS_PORT: "8001"
  MCP_LICHESS_PORT: "8002"
