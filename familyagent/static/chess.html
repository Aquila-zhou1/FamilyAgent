<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Agent</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        :root {
            --ink: #1f2421;
            --muted: #6b716c;
            --board-dark: #5b7a52;
            --board-light: #ecebd9;
            --paper: #faf9f4;
            --line: #dcdccb;
            --danger: #a8402c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        [v-cloak] {
            display: none;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background-color: var(--board-light);
            background-image:
                linear-gradient(45deg, rgba(91, 122, 82, .10) 25%, transparent 25%, transparent 75%, rgba(91, 122, 82, .10) 75%),
                linear-gradient(45deg, rgba(91, 122, 82, .10) 25%, transparent 25%, transparent 75%, rgba(91, 122, 82, .10) 75%);
            background-size: 96px 96px;
            background-position: 0 0, 48px 48px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .app {
            width: 100%;
            max-width: 820px;
            height: 92vh;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(31, 36, 33, .18);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background: var(--ink);
            color: var(--board-light);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: .02em;
        }

        header h1 .piece {
            margin-right: 8px;
            font-size: 22px;
        }

        .lang-toggle {
            background: transparent;
            color: var(--board-light);
            border: 1px solid rgba(236, 235, 217, .5);
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .lang-toggle:hover,
        .lang-toggle:focus-visible {
            background: rgba(236, 235, 217, .15);
            outline: none;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .msg {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .msg.user {
            align-self: flex-end;
            background: var(--board-dark);
            color: #fff;
            border-bottom-right-radius: 2px;
        }

        .msg.ai {
            align-self: flex-start;
            background: #fff;
            border: 1px solid var(--line);
            border-bottom-left-radius: 2px;
        }

        .msg.error {
            border-color: var(--danger);
            color: var(--danger);
        }

        .msg p {
            margin-bottom: 8px;
        }

        .msg p:last-child {
            margin-bottom: 0;
        }

        .msg ul,
        .msg ol {
            margin: 6px 0;
            padding-left: 22px;
        }

        .msg code {
            font-family: Consolas, Menlo, monospace;
            font-size: .92em;
            background: rgba(91, 122, 82, .14);
            padding: 1px 5px;
            border-radius: 4px;
        }

        .msg pre {
            background: var(--ink);
            color: var(--board-light);
            padding: 10px;
            border-radius: 6px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .msg pre code {
            background: transparent;
            padding: 0;
        }

        .typing {
            color: var(--muted);
            font-style: italic;
        }

        .examples {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .examples button {
            background: #fff;
            color: var(--ink);
            border: 1px solid var(--line);
            border-radius: 999px;
            padding: 6px 12px;
            font-size: 13px;
            cursor: pointer;
        }

        .examples button:hover {
            border-color: var(--board-dark);
        }

        footer {
            padding: 14px 20px;
            border-top: 1px solid var(--line);
            background: #fff;
            display: flex;
            gap: 10px;
            align-items: flex-end;
            flex-shrink: 0;
        }

        textarea {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid var(--line);
            border-radius: 8px;
            resize: none;
            font: inherit;
            font-size: 15px;
            line-height: 1.5;
            min-height: 46px;
            max-height: 150px;
        }

        textarea:focus {
            outline: 2px solid var(--board-dark);
            outline-offset: 1px;
        }

        .send {
            height: 46px;
            padding: 0 22px;
            background: var(--board-dark);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .send:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .app {
                height: 100vh;
                border-radius: 0;
                border: none;
            }

            .msg {
                max-width: 92%;
            }
        }
    </style>
</head>

<body>
    <div class="app" id="app" v-cloak>
        <header>
            <h1><span class="piece" aria-hidden="true">♞</span>{{ t.title }}</h1>
            <button class="lang-toggle" @click="toggleLang" :aria-label="t.toggleLabel">{{ t.toggleText }}</button>
        </header>

        <main class="chat" ref="chat">
            <div class="msg ai" v-html="render(t.welcome)"></div>
            <div class="examples" v-if="messages.length === 0">
                <button v-for="q in t.examples" :key="q" @click="ask(q)">{{ q }}</button>
            </div>
            <div v-for="(m, i) in messages" :key="i" :class="['msg', m.role, { error: m.error }]">
                <div v-if="m.role === 'user'">{{ m.content }}</div>
                <div v-else-if="m.content" v-html="render(m.content)"></div>
                <div v-else class="typing">{{ t.thinking }}</div>
            </div>
        </main>

        <footer>
            <textarea v-model="input" ref="input" :placeholder="t.placeholder" :disabled="sending"
                @keydown.enter.exact.prevent="send" @input="resize"></textarea>
            <button class="send" @click="send" :disabled="sending || !input.trim()">
                {{ sending ? t.sending : t.send }}
            </button>
        </footer>
    </div>

    <script>
        const I18N = {
            en: {
                title: 'Chess Agent',
                toggleText: '中文',
                toggleLabel: 'Switch to Chinese',
                welcome: 'Hi! Ask me about **chess openings** or **Lichess puzzles**.',
                examples: [
                    'What is the Sicilian Defense?',
                    'Which opening starts with 1. e4 e5 2. Nf3 Nc6 3. Bb5?',
                    'What is the solution to today\'s Lichess puzzle?'
                ],
                placeholder: 'Type a question. Enter to send, Shift+Enter for a new line.',
                send: 'Send',
                sending: 'Sending…',
                thinking: 'Thinking…',
                error: 'Something went wrong. Please try again.'
            },
            zh: {
                title: '国际象棋助手',
                toggleText: 'English',
                toggleLabel: '切换到英文',
                welcome: '你好！可以问我**国际象棋开局**或 **Lichess 谜题**相关的问题。',
                examples: [
                    '什么是西西里防御？',
                    '1. e4 e5 2. Nf3 Nc6 3. Bb5 是什么开局？',
                    '今天的 Lichess 每日谜题答案是什么？'
                ],
                placeholder: '输入问题。Enter 发送，Shift+Enter 换行。',
                send: '发送',
                sending: '发送中…',
                thinking: '思考中…',
                error: '出错了，请稍后重试。'
            }
        };

        function loadLang() {
            try {
                const saved = localStorage.getItem('chess-agent-lang');
                return saved === 'zh' ? 'zh' : 'en';
            } catch (e) {
                return 'en';
            }
        }

        marked.setOptions({ breaks: true, gfm: true });

        Vue.createApp({
            data() {
                return { lang: loadLang(), messages: [], input: '', sending: false };
            },
            computed: {
                t() { return I18N[this.lang]; }
            },
            watch: {
                lang: { immediate: true, handler: 'applyLang' }
            },
            mounted() {
                this.$refs.input.focus();
            },
            methods: {
                applyLang() {
                    document.documentElement.lang = this.lang === 'zh' ? 'zh-CN' : 'en';
                    document.title = this.t.title;
                },
                toggleLang() {
                    this.lang = this.lang === 'en' ? 'zh' : 'en';
                    try { localStorage.setItem('chess-agent-lang', this.lang); } catch (e) { /* ignore */ }
                },
                render(text) {
                    return DOMPurify.sanitize(marked.parse(text || ''));
                },
                ask(question) {
                    this.input = question;
                    this.send();
                },
                async send() {
                    const question = this.input.trim();
                    if (this.sending || !question) return;

                    this.messages.push({ role: 'user', content: question });
                    this.messages.push({ role: 'ai', content: '' });
                    const reply = this.messages[this.messages.length - 1];
                    this.input = '';
                    this.$refs.input.style.height = 'auto';
                    this.sending = true;
                    this.scroll();

                    try {
                        const response = await fetch('/agent/chess/stream', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ question, lang: this.lang })
                        });
                        if (!response.ok) throw new Error('HTTP ' + response.status);

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;
                            reply.content += decoder.decode(value, { stream: true });
                            this.scroll();
                        }
                        if (!reply.content) throw new Error('empty response');
                    } catch (err) {
                        console.error(err);
                        reply.content = this.t.error;
                        reply.error = true;
                    } finally {
                        this.sending = false;
                        this.scroll();
                        this.$nextTick(() => this.$refs.input.focus());
                    }
                },
                scroll() {
                    this.$nextTick(() => {
                        const el = this.$refs.chat;
                        if (el) el.scrollTop = el.scrollHeight;
                    });
                },
                resize() {
                    const el = this.$refs.input;
                    el.style.height = 'auto';
                    el.style.height = Math.min(el.scrollHeight, 150) + 'px';
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
