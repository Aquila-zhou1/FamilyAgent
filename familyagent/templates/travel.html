<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭旅游规划智能体</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #e7fce9 0%, #cfeefb 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 头部 */
        .chat-header {
            background: linear-gradient(135deg, #9972f4 0%, #4853ec 100%);
            color: white;
            padding: 16px 20px;
            flex-shrink: 0;
        }

        .chat-header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
        }

        /* 免责提示 */
        .disclaimer {
            font-size: 0.75rem;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 10px;
            border-radius: 6px;
            text-align: center;
            margin-top: 8px;
        }

        /* 聊天窗口 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8fafc;
        }

        .message {
            display: flex;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.ai {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        /* 用户消息 - 绿色 */
        .message.user .message-content {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 2px 8px rgba(34, 197, 94, 0.3);
        }

        /* AI 消息 - 蓝色 */
        .message.ai .message-content {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }

        /* 加载动画 - 打字机效果 */
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 12px 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            max-width: 80px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-8px);
            }
        }

        /* 输入区域 */
        .chat-input-area {
            padding: 16px 20px;
            background: white;
            border-top: 1px solid #e2e8f0;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        .input-container {
            flex: 1;
        }

        textarea {
            width: 100%;
            min-height: 50px;
            max-height: 150px;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            font-family: inherit;
            resize: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            line-height: 1.5;
        }

        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        .send-btn {
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 24px;
            height: 24px;
        }

        /* 错误提示 */
        .error-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* 欢迎消息 */
        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #64748b;
        }

        .welcome-message h2 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #334155;
        }

        .welcome-message p {
            font-size: 0.95rem;
        }

        /* Markdown 样式 */
        .message-content :deep(pre) {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message-content :deep(code) {
            font-family: Consolas, Monaco, monospace;
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .message-content :deep(p) {
            margin-bottom: 8px;
        }

        .message-content :deep(p):last-child {
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="chat-container">
            <!-- 头部 -->
            <header class="chat-header">
                <h1>家庭出游助手</h1>
                <div class="disclaimer">
                    ⚠️ 温馨提示：本助手提供的建议仅供参考，不能代表真实数据。
                </div>
            </header>

            <!-- 聊天窗口 -->
            <div class="chat-messages" ref="messagesContainer">
                <!-- 欢迎消息 -->
                <div v-if="messages.length === 0 && !isLoading" class="welcome-message">
                    <h2> 您好！</h2>
                    <p>我是您的家庭出游助手，可以为您规划考虑儿童、老人的家庭旅游行程。</p>
                </div>

                <!-- 消息列表 -->
                <div v-for="(message, index) in messages" :key="index" class="message" :class="message.role">
                    <div class="message-content" v-html="formatMessage(message.content)"></div>
                </div>

                <!-- 加载动画 -->
                <div v-if="isLoading && messages.length === 0" class="message ai">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>

            <!-- 输入区域 -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <div class="input-container">
                        <textarea ref="inputRef" v-model="userInput" @keydown.enter.exact.prevent="sendMessage"
                            @input="autoResize" placeholder="请输入您的健康问题..." :disabled="isLoading"></textarea>
                    </div>
                    <button class="send-btn" @click="sendMessage" :disabled="isLoading || !userInput.trim()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13" />
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- 错误提示 -->
        <div v-if="errorMessage" class="error-toast">
            [[ errorMessage ]]
        </div>
    </div>

    <script>
        const { createApp, ref, nextTick } = Vue;

        createApp({
            delimiters: ['[[', ']]'],
            setup() {
                const messages = ref([]);
                const userInput = ref('');
                const isLoading = ref(false);
                const errorMessage = ref('');
                const messagesContainer = ref(null);
                const inputRef = ref(null);

                // 自动滚动到底部
                const scrollToBottom = async () => {
                    await nextTick();
                    if (messagesContainer.value) {
                        messagesContainer.value.scrollTop = messagesContainer.value.scrollHeight;
                    }
                };

                // 输入框自适应高度
                const autoResize = () => {
                    const textarea = inputRef.value;
                    if (textarea) {
                        textarea.style.height = 'auto';
                        const newHeight = Math.min(textarea.scrollHeight, 150);
                        textarea.style.height = newHeight + 'px';
                    }
                };

                // 格式化消息（支持简单的 Markdown）
                const formatMessage = (content) => {
                    if (!content) return '';

                    let formatted = content
                        .replace(/&/g, '&')
                        .replace(/</g, '<')
                        .replace(/>/g, '>');

                    // 代码块
                    formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
                    // 行内代码
                    formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
                    // 粗体
                    formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                    // 换行
                    formatted = formatted.replace(/\n/g, '<br>');

                    return formatted;
                };

                // 发送消息
                const sendMessage = async () => {
                    const text = userInput.value.trim();
                    if (!text || isLoading.value) return;

                    // 添加用户消息
                    messages.value.push({ role: 'user', content: text });
                    userInput.value = '';
                    autoResize();
                    isLoading.value = true;
                    errorMessage.value = '';
                    await scrollToBottom();

                    // 添加 AI 消息占位
                    const aiMessageIndex = messages.value.length;
                    messages.value.push({ role: 'ai', content: '' });
                    await scrollToBottom();

                    try {
                        const formData = new FormData();
                        formData.append('query', text);

                        const response = await fetch('/agent/travel/stream/', {
                            method: 'POST',
                            body: formData
                        });

                        if (!response.ok) {
                            throw new Error('请求失败，请稍后重试');
                        }

                        // 读取流式响应（纯文本流）
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let accumulatedContent = '';

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value, { stream: true });
                            accumulatedContent += chunk;
                            messages.value[aiMessageIndex].content = accumulatedContent;
                            await scrollToBottom();
                        }
                    } catch (error) {
                        console.error('发送消息失败:', error);
                        errorMessage.value = error.message || '网络错误，请检查连接后重试';
                        // 移除空的 AI 消息
                        if (messages.value[aiMessageIndex]?.content === '') {
                            messages.value.splice(aiMessageIndex, 1);
                        }
                    } finally {
                        isLoading.value = false;
                        if (errorMessage.value) {
                            setTimeout(() => { errorMessage.value = ''; }, 3000);
                        }
                    }
                };

                return {
                    messages,
                    userInput,
                    isLoading,
                    errorMessage,
                    messagesContainer,
                    inputRef,
                    autoResize,
                    formatMessage,
                    sendMessage
                };
            }
        }).mount('#app');
    </script>
</body>

</html>
