<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭助手智能体</title>
    <!-- 引入 Vue3 CDN -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- 引入 marked.js 用于 Markdown 渲染 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #fce7f3 0%, #fbcfe8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 顶部状态栏 */
        .status-bar {
            background: linear-gradient(135deg, #f472b6 0%, #ec4899 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .status-bar h1 {
            font-size: 20px;
            font-weight: 500;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        /* 聊天内容区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            background: #f8fafc;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            margin-bottom: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.ai {
            align-self: flex-start;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            flex-shrink: 0;
            font-size: 14px;
        }

        .avatar.user {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
        }

        .avatar.ai {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
        }

        .message-content {
            background: #f1f3f4;
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            line-height: 1.6;
            word-wrap: break-word;
            font-size: 0.95rem;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            color: white;
        }

        .message.ai .message-content {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        .disclaimer {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.9);
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.3);
        }

        .message.ai .disclaimer {
            color: rgba(255, 255, 255, 0.8);
            border-top-color: rgba(255, 255, 255, 0.3);
        }

        /* 输入框区域 */
        .input-container {
            padding: 20px;
            border-top: 1px solid #e2e8f0;
            background: white;
            flex-shrink: 0;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }

        textarea {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            resize: none;
            font-size: 14px;
            font-family: inherit;
            line-height: 1.5;
            min-height: 50px;
            max-height: 150px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        textarea::placeholder {
            color: #94a3b8;
        }

        button {
            padding: 12px 24px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* 错误提示 */
        .error-toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            z-index: 1000;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Markdown 样式 */
        .message-content :deep(p) {
            margin-bottom: 8px;
        }

        .message-content :deep(p):last-child {
            margin-bottom: 0;
        }

        .message-content :deep(pre) {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .message-content :deep(code) {
            font-family: Consolas, Monaco, monospace;
            font-size: 0.9em;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .message-content :deep(pre code) {
            background: transparent;
            padding: 0;
        }

        .message-content :deep(ul),
        .message-content :deep(ol) {
            margin: 8px 0;
            padding-left: 20px;
        }

        .message-content :deep(li) {
            margin: 4px 0;
        }

        .message-content :deep(strong) {
            font-weight: 600;
        }

        .message-content :deep(h1),
        .message-content :deep(h2),
        .message-content :deep(h3) {
            margin: 12px 0 8px;
            font-weight: 600;
        }

        .message-content :deep(h1) {
            font-size: 1.4em;
        }

        .message-content :deep(h2) {
            font-size: 1.2em;
        }

        .message-content :deep(h3) {
            font-size: 1.1em;
        }

        .message-content :deep(table) {
            border-collapse: collapse;
            width: 100%;
            margin: 8px 0;
        }

        .message-content :deep(th),
        .message-content :deep(td) {
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 8px;
            text-align: left;
        }

        .message-content :deep(th) {
            background: rgba(0, 0, 0, 0.1);
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            .container {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            .message {
                max-width: 90%;
            }

            .status-bar h1 {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="container" id="app">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <h1>家庭助手智能体</h1>
            <div class="status-indicator">
                <div class="status-dot" :style="{ backgroundColor: agentStatus === '正常' ? 'lightgreen' : 'red' }"></div>
                <span>智能体状态：[[ agentStatus ]]</span>
            </div>
        </div>

        <!-- 聊天内容区域 -->
        <div class="chat-container" ref="chatContainer">
            <div v-for="(msg, index) in messages" :key="index" :class="['message', msg.role]">
                <div :class="['avatar', msg.role]">
                    [[ msg.role === 'user' ? '我' : 'AI' ]]
                </div>
                <div class="message-content">
                    <div v-if="msg.content" v-html="renderMarkdown(msg.content)"></div>
                    <div v-else-if="msg.loading" class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <div v-if="msg.role === 'ai' && msg.content" class="disclaimer">
                        注：以上内容仅供参考，不能替代专业医疗建议
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入框区域 -->
        <div class="input-container">
            <div class="input-wrapper">
                <textarea v-model="inputMessage" placeholder="请输入您的问题（支持健康问答、旅游规划等）..." @keyup.enter.ctrl="sendMessage"
                    @keyup.enter.shift="sendMessage" @input="autoResizeTextarea" ref="textarea"
                    :disabled="isSending"></textarea>
                <button @click="sendMessage" :disabled="isSending || !inputMessage.trim()">
                    [[ isSending ? '发送中...' : '发送' ]]
                </button>
            </div>
        </div>
    </div>


    <script>
        // 使用 Vue3 的全局 API
        const { createApp } = Vue;

        // 配置 marked.js 选项
        marked.setOptions({
            breaks: true,        // 启用换行符转<br>
            gfm: true,           // 启用 GitHub 风格 Markdown
            headerIds: false,    // 不生成 header id
            mangle: false        // 不转义邮箱
        });

        createApp({
            // 设置 Vue 模板分隔符，避免与 Jinja2 冲突
            delimiters: ['[[', ']]'],

            // 数据定义
            data() {
                return {
                    // 智能体状态
                    agentStatus: '正常',
                    // 聊天消息列表
                    messages: [],
                    // 用户输入内容
                    inputMessage: '',
                    // 是否正在发送消息
                    isSending: false,
                    // 错误信息
                    errorMessage: ''
                };
            },

            // 组件挂载完成后执行
            mounted() {
                // 初始化时聚焦输入框
                this.$refs.textarea.focus();

                // 添加欢迎消息
                this.messages.push({
                    role: 'ai',
                    content: '您好！我是您的家庭智能助手，可以帮您解答各种问题。\n\n我能帮您：\n- 健康问答：如：感冒了怎么办？\n- 旅游规划：如：杭州 3 天家庭旅游路线\n- 其他问题：日常聊天、咨询等\n\n您可以直接输入您的问题，我会根据内容自动分发到相应的智能体。'
                });
            },

            // 方法定义
            methods: {
                // 使用 marked.js 渲染 Markdown
                renderMarkdown(content) {
                    if (!content) return '';
                    // 使用 marked.parse 渲染 Markdown
                    return marked.parse(content);
                },

                // 解码 HTML 实体
                decodeHtml(html) {
                    const txt = document.createElement('textarea');
                    txt.innerHTML = html;
                    return txt.value;
                },

                // 发送消息
                async sendMessage() {
                    // 如果正在发送或输入为空，则不处理
                    if (this.isSending || !this.inputMessage.trim()) return;

                    // 获取用户输入内容
                    const userMessage = this.inputMessage.trim();

                    // 添加用户消息到聊天列表
                    this.messages.push({
                        role: 'user',
                        content: userMessage
                    });

                    // 清空输入框并重置高度
                    this.inputMessage = '';
                    this.$refs.textarea.style.height = 'auto';

                    // 滚动到底部
                    this.scrollToBottom();

                    // 添加 AI 正在输入的消息
                    this.messages.push({
                        role: 'ai',
                        loading: true
                    });

                    // 滚动到底部
                    this.scrollToBottom();

                    // 设置发送状态
                    this.isSending = true;
                    this.errorMessage = '';

                    try {
                        // 发送请求到后端智能体分发 API（流式）
                        const response = await fetch('/agent/dispatch/stream', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ question: userMessage })
                        });

                        // 检查请求是否成功
                        if (!response.ok) {
                            throw new Error('请求失败');
                        }

                        // 获取 AI 消息索引
                        const aiMessageIndex = this.messages.length - 1;

                        // 读取流式响应
                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let accumulatedContent = '';

                        // 移除 loading 状态
                        this.messages[aiMessageIndex].loading = false;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            const chunk = decoder.decode(value, { stream: true });
                            accumulatedContent += chunk;
                            this.messages[aiMessageIndex].content = accumulatedContent;
                            await this.scrollToBottom();
                        }

                        // 更新智能体状态
                        this.agentStatus = '正常';

                    } catch (error) {
                        // 显示错误信息
                        this.messages[this.messages.length - 1] = {
                            role: 'ai',
                            content: '抱歉，处理您的请求时出现错误，请稍后重试。'
                        };
                        this.errorMessage = error.message || '网络错误，请检查连接后重试';
                        console.error('Error:', error);
                        // 3 秒后清除错误信息
                        setTimeout(() => { this.errorMessage = ''; }, 3000);
                    } finally {
                        // 重置发送状态
                        this.isSending = false;
                        // 滚动到底部
                        this.scrollToBottom();
                    }
                },

                // 滚动到底部
                scrollToBottom() {
                    this.$nextTick(() => {
                        if (this.$refs.chatContainer) {
                            this.$refs.chatContainer.scrollTop = this.$refs.chatContainer.scrollHeight;
                        }
                    });
                },

                // 自动调整文本框高度
                autoResizeTextarea() {
                    const textarea = this.$refs.textarea;
                    if (textarea) {
                        textarea.style.height = 'auto';
                        textarea.style.height = Math.min(textarea.scrollHeight, 150) + 'px';
                    }
                }
            }
        }).mount('#app');
    </script>
</body>

</html>
